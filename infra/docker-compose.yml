services:
  postgres:
    image: postgres:16-alpine
    container_name: marketmind-postgres
    environment:
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: marketmind
      POSTGRES_DB: marketmind
    ports:
      # Host 5433 para não colidir com outros Postgres locais (container segue na 5432).
      - "5433:5432"
    volumes:
      - marketmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketmind-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Worker assíncrono (consome as filas BullMQ). Roda via ts-node em dev; em
  # produção, empacotar com um Dockerfile dedicado (infra/docker/workers.Dockerfile).
  workers:
    image: node:20-alpine
    container_name: marketmind-workers
    working_dir: /app
    profiles: ["full"]
    command: >-
      sh -c "corepack enable &&
             corepack pnpm install --frozen-lockfile &&
             corepack pnpm --filter @marketmind/api exec prisma generate &&
             corepack pnpm --filter @marketmind/queue build &&
             corepack pnpm --filter @marketmind/sdk-mercadolivre build &&
             corepack pnpm --filter @marketmind/workers start"
    environment:
      WORKERS_ROLE: worker
      DATABASE_URL: postgresql://marketmind:marketmind@postgres:5432/marketmind?schema=public
      APP_DATABASE_URL: postgresql://marketmind:marketmind@postgres:5432/marketmind?schema=public
      REDIS_URL: redis://redis:6379
      TOKEN_ENCRYPTION_KEY: dev-token-encryption-key-change-me-please
      WORKERS_HEALTH_PORT: "3334"
    ports:
      - "3334:3334"
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Scheduler (registra os jobs repetíveis). Mesma imagem, papel diferente.
  scheduler:
    image: node:20-alpine
    container_name: marketmind-scheduler
    working_dir: /app
    profiles: ["full"]
    command: >-
      sh -c "corepack enable &&
             corepack pnpm install --frozen-lockfile &&
             corepack pnpm --filter @marketmind/queue build &&
             corepack pnpm --filter @marketmind/workers start"
    environment:
      WORKERS_ROLE: scheduler
      APP_DATABASE_URL: postgresql://marketmind:marketmind@postgres:5432/marketmind?schema=public
      REDIS_URL: redis://redis:6379
      TOKEN_ENCRYPTION_KEY: dev-token-encryption-key-change-me-please
      WORKERS_HEALTH_PORT: "3335"
    volumes:
      - ../:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  marketmind-pgdata:
