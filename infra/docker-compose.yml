services:
  postgres:
    image: postgres:16-alpine
    container_name: marketmind-postgres
    environment:
      POSTGRES_USER: marketmind
      POSTGRES_PASSWORD: marketmind
      POSTGRES_DB: marketmind
    ports:
      # Host 5433 para não colidir com outros Postgres locais (container segue na 5432).
      - "5433:5432"
    volumes:
      - marketmind-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: marketmind-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  marketmind-pgdata:
