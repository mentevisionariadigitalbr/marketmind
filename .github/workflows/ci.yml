name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://marketmind:marketmind@localhost:5432/marketmind?schema=public
      APP_DATABASE_URL: postgresql://marketmind_app:marketmind_app@localhost:5432/marketmind?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-ci-token-encryption-key
      REDIS_URL: redis://localhost:6379

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: marketmind
          POSTGRES_PASSWORD: marketmind
          POSTGRES_DB: marketmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @marketmind/api prisma:generate

      - name: Apply database migrations (schema + RLS + app role)
        run: pnpm --filter @marketmind/api exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (sdk + api + web)
        run: pnpm build

      - name: Unit tests
        run: |
          pnpm --filter @marketmind/queue test
          pnpm --filter @marketmind/sdk-mercadolivre test
          pnpm --filter @marketmind/workers test
          pnpm --filter @marketmind/api test

      - name: Integration tests — API (RLS / RBAC / audit / ingestion)
        run: pnpm --filter @marketmind/api test:int

      - name: Integration tests — Workers (BullMQ roundtrip / idempotency / DLQ)
        run: pnpm --filter @marketmind/workers test:int
